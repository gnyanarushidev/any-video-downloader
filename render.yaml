services:
  - type: web
    name: any-video-downloader
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: YTDLP_BINARY_PATH
        value: /usr/bin/yt-dlp
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: MAX_DOWNLOAD_MB
        value: "250"
      - key: MAX_DURATION_SECONDS
        value: "1800"
      - key: MAX_ZIP_ITEMS
        value: "5"
      - key: MAX_ZIP_TOTAL_MB
        value: "400"
      - key: ENABLE_ZIP_DOWNLOADS
        value: "false"
